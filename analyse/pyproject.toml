[project]
name = "cahiers-analyse"
version = "0.1.0"
description = "Analyse du corpus des cahiers citoyens de 2019 : typage des pages, cascade, communes, panel"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "instructor>=1.17.0",
    "numpy>=2.2",
    "openai>=3.3.0",
    "openpyxl>=3.1.5",
    "pydantic>=2.14.1",
    "pymupdf>=1.28.2",
    "wordfreq>=3.1.1",
]

[dependency-groups]
dev = [
    "pre-commit",
    "pytest",
    "ruff",
    "tox",
    "tox-uv",
]

# modèles locaux pour l'anonymisation : uv sync --group modeles
modeles = [
    "gliner>=0.2",
    "protobuf",
    "sentencepiece",
    "transformers<5",  # GLiNER ne lit pas encore les tokenizers de la v5
    "torch>=2.9",
]

# rapprochement des pages de l'Aude (points SIFT) : uv sync --group images
images = [
    "opencv-python-headless>=4.10",
]

[tool.uv]
# un groupe à part : `uv sync` seul ne l'installe pas
default-groups = ["dev"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
target-version = "py314"

[tool.pytest.ini_options]
pythonpath = ["."]
