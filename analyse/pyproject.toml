[project]
name = "cahiers-analyse"
version = "0.1.0"
description = "Analyse du corpus des cahiers citoyens de 2019 : typage des pages, cascade, communes, panel"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "openpyxl>=3.1.5",
    "pymupdf>=1.28.2",
    "wordfreq>=3.1.1",
]

[dependency-groups]
dev = [
    "pre-commit",
    "pytest",
    "ruff",
    "tox",
    "tox-uv",
]

[tool.ruff]
target-version = "py314"

[tool.pytest.ini_options]
pythonpath = ["."]
