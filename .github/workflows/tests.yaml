name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  analyse:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: analyse
    steps:
    - uses: actions/checkout@v4
    - uses: astral-sh/setup-uv@v10.2.0
    - run: uv sync --locked
    - run: uv run pytest
