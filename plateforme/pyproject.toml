[project]
name = "cahiers-plateforme"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "dj-database-url>=3.1.2",
    "django>=6.1.2",
    "django-storages[s3]>=1.14.6",
    "gunicorn>=26.2.0",
    "psycopg[binary]>=3.3.6",
    "whitenoise>=6.12.0",
]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
# Django déclare ses réglages en listes de classe (admin, Meta, migrations).
ignore = ["RUF012"]
