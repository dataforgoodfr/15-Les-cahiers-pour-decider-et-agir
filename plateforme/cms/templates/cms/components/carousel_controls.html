{# Commandes d'un carrousel ; les pastilles sont générées par cms.js. #}
<div class="carousel__controls">
  <button class="carousel__button" type="button" data-carousel-prev aria-label="Précédent">
    <svg class="icon" aria-hidden="true"><use href="#i-arrow-left"/></svg>
  </button>
  <div class="carousel__dots"></div>
  <button class="carousel__button" type="button" data-carousel-next aria-label="Suivant">
    <svg class="icon" aria-hidden="true"><use href="#i-arrow-right"/></svg>
  </button>
</div>
