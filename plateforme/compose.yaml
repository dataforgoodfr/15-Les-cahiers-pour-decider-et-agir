services:
  db:
    image: postgres:18
    container_name: pg-cahiers
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cahiers}
      POSTGRES_DB: ${POSTGRES_DB:-cahiers}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg_cahiers_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-cahiers}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pg_cahiers_data:
